apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mess-ordering-system
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shivam-dewangan/Mess-ordering-system.git
    targetRevision: main
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: mess-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
