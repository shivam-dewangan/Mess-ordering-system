apiVersion: apps/v1
kind: Deployment
metadata:
  name: mess-backend
  namespace: mess-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mess-backend
  template:
    metadata:
      labels:
        app: mess-backend
    spec:
      containers:
        - name: backend
          image: shivamaws2005/mess-backend:1d527e8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/mess"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mess-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
