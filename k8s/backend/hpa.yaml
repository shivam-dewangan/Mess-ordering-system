apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mess-backend-hpa
  namespace: mess-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mess-backend
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
