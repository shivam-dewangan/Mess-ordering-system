apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mess-ingress
  namespace: mess-system
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mess-frontend
                port:
                  number: 80
