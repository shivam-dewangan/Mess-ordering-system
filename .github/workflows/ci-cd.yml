name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: shivamaws2005

jobs:

  # ==========================================================
  # BACKEND CI
  # ==========================================================

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build --if-present


  # ==========================================================
  # FRONTEND CI
  # ==========================================================

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ==========================================================
  # SEMANTIC VERSION + GITHUB RELEASE
  # ==========================================================

  release:
    name: Semantic Version Release
    runs-on: ubuntu-latest

    needs:
      - backend-ci
      - frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:

      # ------------------------------------------------------
      # CHECKOUT FULL HISTORY
      # ------------------------------------------------------

      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # CALCULATE SEMANTIC VERSION
      # ------------------------------------------------------

      - name: Calculate semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LAST_TAG"

          VERSION="${LAST_TAG#v}"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          echo "Commit message:"
          echo "$COMMIT_MESSAGE"

          # --------------------------------------------------
          # MAJOR RELEASE
          # --------------------------------------------------

          if echo "$COMMIT_MESSAGE" | grep -qE 'BREAKING CHANGE|^[a-zA-Z]+(\(.+\))?!:'; then

            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          # --------------------------------------------------
          # MINOR RELEASE
          # --------------------------------------------------

          elif echo "$COMMIT_MESSAGE" | grep -qE '^feat(\(.+\))?:'; then

            MINOR=$((MINOR + 1))
            PATCH=0

          # --------------------------------------------------
          # PATCH RELEASE
          # --------------------------------------------------

          elif echo "$COMMIT_MESSAGE" | grep -qE '^fix(\(.+\))?:'; then

            PATCH=$((PATCH + 1))

          # --------------------------------------------------
          # NO RELEASE
          # --------------------------------------------------

          else

            echo "No release-worthy Conventional Commit found."

            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "=========================================="
          echo "NEW VERSION : $NEW_VERSION"
          echo "NEW TAG     : $NEW_TAG"
          echo "=========================================="

          # Validate values before exporting them
          if [ -z "$NEW_VERSION" ]; then
            echo "ERROR: NEW_VERSION is empty"
            exit 1
          fi

          if [ -z "$NEW_TAG" ]; then
            echo "ERROR: NEW_TAG is empty"
            exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          echo "GitHub Actions outputs:"
          echo "released=true"
          echo "version=$NEW_VERSION"
          echo "tag=$NEW_TAG"


      # ------------------------------------------------------
      # CREATE GIT TAG
      # ------------------------------------------------------

      - name: Create Git tag
        if: steps.version.outputs.released == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION output is empty."
            exit 1
          fi

          TAG="v${VERSION}"

          if [ -z "$TAG" ]; then
            echo "ERROR: TAG is empty."
            exit 1
          fi

          echo "=========================================="
          echo "Creating Git tag"
          echo "VERSION: $VERSION"
          echo "TAG:     $TAG"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            exit 1
          fi

          git tag -a "$TAG" -m "Release $VERSION"

          git push origin "$TAG"

          echo "Git tag $TAG created successfully."


      # ------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ------------------------------------------------------

      - name: Create GitHub Release
        if: steps.version.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION output is empty."
            exit 1
          fi

          TAG="v${VERSION}"

          echo "Creating GitHub Release: $TAG"

          gh release create "$TAG" \
            --title "Release $VERSION" \
            --generate-notes

          echo "GitHub Release $TAG created successfully."


  # ==========================================================
  # DOCKER BUILD + PUSH + GITOPS
  # ==========================================================

  docker:
    name: Build Push and Update GitOps
    runs-on: ubuntu-latest

    needs:
      - release

    if: needs.release.outputs.released == 'true'

    steps:

      # ------------------------------------------------------
      # CHECKOUT MAIN
      # ------------------------------------------------------

      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0


      # ------------------------------------------------------
      # SETUP DOCKER BUILDX
      # ------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # DOCKER HUB LOGIN
      # ------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # BUILD + PUSH BACKEND
      # ------------------------------------------------------

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true

          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:${{ needs.release.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------------------
      # BUILD + PUSH FRONTEND
      # ------------------------------------------------------

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true

          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:${{ needs.release.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ======================================================
      # GITOPS — UPDATE KUBERNETES IMAGE TAGS
      # ======================================================

      - name: Update Kubernetes image versions
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty."
            exit 1
          fi

          echo "Updating Kubernetes images to version: $VERSION"

          sed -i \
            "s#image: shivamaws2005/mess-backend:.*#image: shivamaws2005/mess-backend:${VERSION}#g" \
            k8s/backend/deployment.yaml

          sed -i \
            "s#image: shivamaws2005/mess-frontend:.*#image: shivamaws2005/mess-frontend:${VERSION}#g" \
            k8s/frontend/deployment.yaml

          echo ""
          echo "Backend image:"
          grep "image:" k8s/backend/deployment.yaml

          echo ""
          echo "Frontend image:"
          grep "image:" k8s/frontend/deployment.yaml


      # ======================================================
      # COMMIT + PUSH GITOPS CHANGE
      # ======================================================

      - name: Commit and Push GitOps update
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend/deployment.yaml
          git add k8s/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes detected."
            exit 0
          fi

          git commit \
            -m "chore: deploy version ${VERSION} [skip ci]"

          git push origin main

          echo ""
          echo "=========================================="
          echo "GitOps update pushed successfully."
          echo "Version: ${VERSION}"
          echo "=========================================="
