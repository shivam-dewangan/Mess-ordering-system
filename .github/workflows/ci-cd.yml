name: CI CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  DOCKERHUB_USERNAME: shivamaws2005

jobs:

  # =========================
  # BACKEND CI
  # =========================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present


  # =========================
  # FRONTEND CI
  # =========================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # =========================
  # RELEASE
  # =========================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    needs:
      - backend-ci
      - frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node


  # =========================
  # DOCKER
  # =========================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - release

    if: needs.release.outputs.released == 'true'

    steps:
      - name: Checkout released version
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"

          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # =========================
      # BACKEND IMAGE
      # =========================
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:latest

      # =========================
      # FRONTEND IMAGE
      # =========================
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:latest
