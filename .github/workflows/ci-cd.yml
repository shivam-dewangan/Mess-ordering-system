name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: shivamaws2005

jobs:

  # ============================================================
  # BACKEND CI
  # ============================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build --if-present


  # ============================================================
  # FRONTEND CI
  # ============================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ============================================================
  # VERSION + RELEASE
  # ============================================================
  release:
    name: Semantic Version Release
    runs-on: ubuntu-latest

    needs:
      - backend-ci
      - frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:

      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Calculate Semantic Version
      # ----------------------------------------------------------
      - name: Calculate version
        id: version
        shell: bash
        run: |

          git fetch --tags --force

          LAST_TAG=$(git tag --sort=-version:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LAST_TAG"

          VERSION="${LAST_TAG#v}"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          echo "Commit message:"
          echo "$COMMIT_MESSAGE"

          # ------------------------------------------------------
          # MAJOR
          # ------------------------------------------------------

          if echo "$COMMIT_MESSAGE" | grep -qE 'BREAKING CHANGE|^[a-zA-Z]+(\(.+\))?!:'; then

            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0

          # ------------------------------------------------------
          # MINOR
          # ------------------------------------------------------

          elif echo "$COMMIT_MESSAGE" | grep -qE '^feat(\(.+\))?:'; then

            MINOR=$((MINOR + 1))
            PATCH=0

          # ------------------------------------------------------
          # PATCH
          # ------------------------------------------------------

          elif echo "$COMMIT_MESSAGE" | grep -qE '^fix(\(.+\))?:'; then

            PATCH=$((PATCH + 1))

          # ------------------------------------------------------
          # NO RELEASE
          # ------------------------------------------------------

          else

            echo "No release-worthy Conventional Commit found."

            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG"

      # ----------------------------------------------------------
      # Create Git Tag
      # ----------------------------------------------------------
      - name: Create Git tag
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $VERSION"

          git push origin "$TAG"

      # ----------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------
      - name: Create GitHub Release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |

          gh release create "$TAG" \
            --title "Release $VERSION" \
            --generate-notes


  # ============================================================
  # DOCKER BUILD + PUSH
  # ============================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - release

    if: needs.release.outputs.released == 'true'

    steps:

      - name: Checkout released version
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # Docker Hub Login
      # ----------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Backend
      # ----------------------------------------------------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:${{ needs.release.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:latest

      # ----------------------------------------------------------
      # Frontend
      # ----------------------------------------------------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:${{ needs.release.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:latest
