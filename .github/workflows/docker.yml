name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: shivamaws2005

jobs:
  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mess-frontend:latest
