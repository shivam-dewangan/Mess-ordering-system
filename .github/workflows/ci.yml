name: Mess Ordering System CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # BACKEND CI
  # ==========================================

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        run: node --check server.js


  # ==========================================
  # FRONTEND CI
  # ==========================================

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ==========================================
  # DOCKER BUILD + PUSH
  # ==========================================

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    # Only push Docker images when code is
    # actually pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # ----------------------------------------
      # Generate Git SHA image tag
      # ----------------------------------------

      - name: Generate image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

          echo "Docker image tag:"
          echo "${GITHUB_SHA::7}"


      # ----------------------------------------
      # Docker Hub Login
      # ----------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ========================================
      # BACKEND IMAGE
      # ========================================

      - name: Build backend Docker image
        run: |
          docker build \
            -t shivamaws2005/mess-backend:${{ steps.meta.outputs.tag }} \
            ./backend

      - name: Push backend Docker image
        run: |
          docker push \
            shivamaws2005/mess-backend:${{ steps.meta.outputs.tag }}


      # ========================================
      # FRONTEND IMAGE
      # ========================================

      - name: Build frontend Docker image
        run: |
          docker build \
            -t shivamaws2005/mess-frontend:${{ steps.meta.outputs.tag }} \
            ./frontend

      - name: Push frontend Docker image
        run: |
          docker push \
            shivamaws2005/mess-frontend:${{ steps.meta.outputs.tag }}


      # ----------------------------------------
      # Show final images
      # ----------------------------------------

      - name: Display pushed images
        run: |
          echo "======================================"
          echo "Docker images pushed successfully"
          echo "======================================"

          echo "Backend:"
          echo "shivamaws2005/mess-backend:${{ steps.meta.outputs.tag }}"

          echo ""

          echo "Frontend:"
          echo "shivamaws2005/mess-frontend:${{ steps.meta.outputs.tag }}"
